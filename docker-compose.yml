# ============================================================
# Docker Compose — OpenClaw Custom
# ============================================================
# Dois serviços:
#   gateway → Servidor principal (sempre rodando)
#   cli     → Container interativo para comandos
#
# Uso:
#   docker compose up -d              → Inicia o gateway
#   docker compose down               → Para tudo
#   docker compose logs -f            → Ver logs em tempo real
#   docker compose run --rm cli onboard  → Onboarding
# ============================================================

services:
  # ============================================================
  # GATEWAY — Serviço principal do OpenClaw
  # ============================================================
  gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/alefsanderribeiro/alefsander-openclaw:latest}
    build: .
    restart: unless-stopped
    container_name: openclaw-gateway

    # ----------------------------------------------------------
    # Rede Docker externa (opcional)
    # ----------------------------------------------------------
    # Conecta o container a uma rede externa para acessar serviços
    # self-hosted pelo nome: searxng, homeassistant, vaultwarden,
    # uptime-kuma, netdata, etc.
    # Crie a rede antes (uma vez):
    #   docker network create selfhosted-net
    # Deixe OPENCLAW_NETWORK vazio no .env se não usar.
    # ----------------------------------------------------------
    networks:
      - default
      - external

    environment:
      # Identidade do container
      - HOME=/home/node
      - TERM=xterm-256color
      - PATH=/home/node/.openclaw/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      # Autenticação do Gateway
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_GATEWAY_PASSWORD=${OPENCLAW_GATEWAY_PASSWORD:-}

      # --- Model Providers ---
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}

      # --- Canais de Mensagem ---
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_APPLICATION_ID=${DISCORD_APPLICATION_ID:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      - SIGNAL_BOT_TOKEN=${SIGNAL_BOT_TOKEN:-}
      - WHATSAPP_SESSION=${WHATSAPP_SESSION:-}

      # --- Ferramentas e Skills ---
      - GH_TOKEN=${GH_TOKEN:-}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080}
      - HOME_ASSISTANT_URL=${HOME_ASSISTANT_URL:-http://homeassistant:8123}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}

      # --- Voz e Mídia ---
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}

      # --- Shell Environment ---
      - OPENCLAW_LOAD_SHELL_ENV=${OPENCLAW_LOAD_SHELL_ENV:-0}
      - OPENCLAW_SHELL_ENV_TIMEOUT_MS=${OPENCLAW_SHELL_ENV_TIMEOUT_MS:-15000}

      # --- Desabilita Bonjour/mDNS (não funciona em Docker bridge) ---
      - OPENCLAW_DISABLE_BONJOUR=1

      # --- Observabilidade (OpenTelemetry / Prometheus) ---
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-gateway}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}

    # ----------------------------------------------------------
    # Volumes — Persistência e acesso a arquivos
    # ----------------------------------------------------------
    volumes:
      # Configuração do OpenClaw (openclaw.json, skills, memória)
      - ${OPENCLAW_CONFIG_DIR:-$HOME/.openclaw}:/home/node/.openclaw

      # Workspace do agente (área de trabalho para operações de arquivo)
      - ${OPENCLAW_WORKSPACE_DIR:-$HOME/.openclaw/workspace}:/home/node/.openclaw/workspace

      # Documentos do host (ex: MEGA Drive sincronizado) — opcional
      - ${OPENCLAW_DOCS_MOUNT:-/dev/null:/dev/null}

      # Docker socket (somente leitura — para sandbox e controle)
      - ${OPENCLAW_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro

      # Cache do Whisper — persiste o modelo entre restarts
      - ${OPENCLAW_CONFIG_DIR:-$HOME/.openclaw}/.cache/whisper:/home/node/.cache/whisper

      # ----------------------------------------------------------
      # MOUNTS EXTRAS (via .env → OPENCLAW_EXTRA_MOUNTS)
      # Gerenciados pelo docker-setup.sh em docker-compose.extra.yml
      # ----------------------------------------------------------

    # ----------------------------------------------------------
    # GPU NVIDIA — Aceleração para Whisper e inferência local
    # ----------------------------------------------------------
    # Requer: nvidia-container-toolkit instalado no HOST.
    # Se não tiver GPU NVIDIA, comente este bloco — o Whisper
    # roda em CPU automaticamente como fallback.
    # ----------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all   # Usa todas as GPUs disponíveis
    #           capabilities: [gpu]

    # ----------------------------------------------------------
    # Portas — Acesso ao Gateway
    # ----------------------------------------------------------
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"

    # ----------------------------------------------------------
    # Security Hardening
    # ----------------------------------------------------------
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - MKNOD
      - AUDIT_WRITE
      - SETFCAP
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - SYS_PTRACE
      - FOWNER
      - KILL

    # Filesystem read-only com exceções em memória
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /var/lib/apt/lists:noexec,nosuid,size=64m
      - /var/cache/apt:noexec,nosuid,size=128m

    # Init process (PID 1) para reap zombies corretamente
    init: true

    # Mapeia host.docker.internal para acesso a serviços do host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ----------------------------------------------------------
    # Comando — Inicia o Gateway
    # ----------------------------------------------------------
    entrypoint: ["openclaw"]
    command:
      [
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  # ============================================================
  # CLI — Container interativo para comandos
  # ============================================================
  cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/alefsanderribeiro/alefsander-openclaw:latest}
    build: .
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - PATH=/home/node/.openclaw/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BROWSER=echo  # Previne abertura de browser no container

    networks:
      - default
      - external

    volumes:
      - ${OPENCLAW_CONFIG_DIR:-$HOME/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-$HOME/.openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_DOCS_MOUNT:-/dev/null:/dev/null}
      - ${OPENCLAW_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${OPENCLAW_CONFIG_DIR:-$HOME/.openclaw}/.cache/whisper:/home/node/.cache/whisper

    # Terminal interativo
    stdin_open: true
    tty: true

    # Mesmas restrições de segurança do gateway
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - MKNOD
      - AUDIT_WRITE
      - SETFCAP
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SYS_PTRACE
      - FOWNER
      - KILL

    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m

    init: true

    # CLI não tem comando padrão — você roda o que precisa
    entrypoint: ["openclaw"]

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-openclaw}-net
  external:
    # Rede externa opcional (SearXNG, HA, Vaultwarden, Kuma...)
    name: ${OPENCLAW_NETWORK:-openclaw-external}
    external: ${OPENCLAW_NETWORK:+true}
